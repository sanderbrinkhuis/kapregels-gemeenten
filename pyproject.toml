[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kapbeleid-gemeenten"
version = "0.1.0"
description = "Bronnen verzamelen en kapregels voor bomen op particulier terrein vergelijken voor alle Nederlandse gemeenten"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []  # alleen de Python-standaardbibliotheek

[project.scripts]
bomen = "bomen.__main__:main"

[tool.setuptools]
packages = ["bomen"]

[tool.ruff]
line-length = 120
